<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accès désactivé</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #000; color: #f2f2f7;
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .icon { width: 64px; height: 64px; border-radius: 50%; background: #ff453a33; color: #ff453a; font-size: 34px; line-height: 64px; margin: 0 auto 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; } p { color: #8e8e93; margin: 0; max-width: 320px; }
  </style>
</head>
<body>
  <main>
    <div class="icon">✕</div>
    <h1>Accès désactivé</h1>
    <p>Ce téléphone n’a plus accès à cette expérience.</p>
  </main>
</body>
</html>
